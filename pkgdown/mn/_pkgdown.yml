url: https://temuulene.github.io/mongolstats/mn/
lang: mn
development:
  mode: release
template:
  bootstrap: 5
  bslib:
    primary: "#0ea5e9"
    success: "#22c55e"
    warning: "#f59e0b"
    danger: "#ef4444"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter Tight"}
    code_font: {google: "JetBrains Mono"}
    enable-dark-mode: true
navbar:
  structure:
    left: [intro, reference, guides]
    right: [english, github]
  components:
    intro:
      text: Эхлэх
      href: index.html
    reference:
      text: Функцүүд (англи)
      href: ../reference/index.html
    guides:
      text: Гарын авлага
      menu:
        - text: Эхлэх заавар (англи)
          href: ../articles/getting-started.html
        - text: Өгөгдөл хайх (англи)
          href: ../articles/discovery.html
        - text: Газрын зураг (англи)
          href: ../articles/mapping.html
        - text: Эх сурвалж, мета өгөгдөл (хоёр хэлээр)
          href: ../articles/data-provenance.html
    english:
      text: English
      href: ../index.html
      aria-label: Read in English
    github:
      icon: fab fa-github
      href: https://github.com/temuulene/mongolstats
      aria-label: Эх кодыг GitHub дээр үзэх
home:
  title: Монгол Улсын албан ёсны статистик R орчинд
  description: ҮСХ-ны өгөгдлийг татах, эх сурвалжийг шалгах, үзүүлэлтийг дүрслэх R багц.
  sidebar:
    structure: [links_mn, license_mn, citation_mn, developer_mn]
    components:
      links_mn:
        title: Холбоос
        text: |
          [English](../index.html)

          [CRAN дахь багц](https://cran.r-project.org/package=mongolstats)

          [Алдаа мэдээлэх](https://github.com/temuulene/mongolstats/issues)
      license_mn:
        title: Лиценз
        text: |
          Код: [MIT](../LICENSE-text.html).
          ҮСХ-ны өгөгдлийн эх сурвалж, лицензийг багцын
          [COPYRIGHTS](https://github.com/temuulene/mongolstats/blob/main/inst/COPYRIGHTS)
          файлаас үзнэ.
      citation_mn:
        title: Иш татах
        text: "[Багцыг иш татах](../authors.html#citation)"
      developer_mn:
        title: Хөгжүүлэгч
        text: Энэбишийн Тэмүүлэн
footer:
  structure:
    left: developer_mn
    right: builder_mn
  components:
    developer_mn: "Хөгжүүлсэн: Энэбишийн Тэмүүлэн."
    builder_mn: "[pkgdown](https://pkgdown.r-lib.org/) ашиглан бүтээв."
