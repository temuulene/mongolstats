name: pkgdown

on:
  push:
    branches: [main, master]
    paths:
      - 'vignettes/**'
      - 'inst/examples/**'
      - 'R/**'
      - 'man/**'
      - 'pkgdown/**'
      - 'tools/**'
      - 'tests/**'
      - '_pkgdown.yml'
      - 'README*'
      - 'DESCRIPTION'
      - 'NEWS.md'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
    paths:
      - 'vignettes/**'
      - 'inst/examples/**'
      - 'R/**'
      - 'man/**'
      - 'pkgdown/**'
      - 'tools/**'
      - 'tests/**'
      - '_pkgdown.yml'
      - 'README*'
      - 'DESCRIPTION'
      - 'NEWS.md'
      - '.github/workflows/pkgdown.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built website
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pkgdown-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Decide whether this build publishes the website
        id: publish
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          # The site documents the latest release, so release builds always
          # publish. A push to main publishes only while DESCRIPTION holds a
          # release version; development versions (x.y.z.9000) never replace
          # the release documentation. Manual runs publish only when asked.
          version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)
          case "$EVENT_NAME" in
            release) publish=true ;;
            workflow_dispatch) publish="${PUBLISH_INPUT:-false}" ;;
            push)
              if [[ "$version" =~ \.9[0-9]{3,}$ ]]; then
                publish=false
                echo "::notice::Development version $version is not published; the site keeps the release documentation."
              else
                publish=true
              fi
              ;;
            *) publish=false ;;
          esac
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libjpeg-dev libtiff5-dev \
            gfortran libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: pkgdown@2.1.3, roxygen2@8.0.0, any::testthat, any::svglite, local::.
          needs: website

      - name: Regenerate Rd with roxygen2
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Test website rendering safeguards
        run: testthat::test_dir("pkgdown/tests", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Build English and Mongolian pages
        env:
          NOT_CRAN: ""
        run: Rscript tools/render_site.R

      - name: Verify rendered figures, language pages, and local links
        run: Rscript tools/check_site.R

      - name: Save built website
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
          retention-days: 14

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Only this job can write to the repository.
    permissions:
      contents: write
    # Release and main builds share one queue, so deployments never overlap.
    concurrency:
      group: pkgdown-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs
          clean: true
