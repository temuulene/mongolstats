name: pkgdown

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built website
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libjpeg-dev libtiff5-dev \
            gfortran libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: pkgdown@2.1.3, roxygen2@8.0.0, any::testthat, local::.
          needs: website

      - name: Regenerate Rd with roxygen2
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Test website rendering safeguards
        run: testthat::test_dir("pkgdown/tests", stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Build English and Mongolian pages
        env:
          NOT_CRAN: ""
        run: Rscript tools/render_site.R

      - name: Verify rendered figures, language pages, and local links
        run: Rscript tools/check_site.R

      - name: Save website preview
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-preview
          path: docs

      - name: Deploy to gh-pages branch
        if: github.event_name == 'release' || inputs.publish
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs
          clean: false
