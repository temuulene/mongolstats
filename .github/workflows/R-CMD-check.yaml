name: R-CMD-check

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - README.md
      - README.Rmd
      - README.html
      - _pkgdown.yml
      - NEWS.md
      - docs/**
      - pkgdown/**
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - README.md
      - README.Rmd
      - README.html
      - _pkgdown.yml
      - NEWS.md
      - docs/**
      - pkgdown/**
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libjpeg-dev libtiff5-dev \
            gfortran libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      # Pin roxygen2 to the version recorded in DESCRIPTION: releases change
      # output formatting (8.1.0 regroups importFrom() in NAMESPACE), which
      # would fail the stale-docs check below although nothing is stale.
      - name: Read roxygen2 version from DESCRIPTION
        id: roxygen
        run: |
          version=$(tr -d '\r' < DESCRIPTION | sed -n 's/^Config\/roxygen2\/version: *//p')
          if [ -z "$version" ]; then
            echo "::error::Config/roxygen2/version is missing from DESCRIPTION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::rcmdcheck,
            roxygen2@${{ steps.roxygen.outputs.version }},
            local::.
          needs: check

      # Fail when committed docs are stale instead of silently regenerating
      # them: the check must test what is in the repository.
      - name: Check Rd files are up to date
        run: |
          roxygen2::roxygenise()
          stale <- system2("git", c("status", "--porcelain", "--", "man", "NAMESPACE"), stdout = TRUE)
          if (length(stale)) {
            system2("git", c("--no-pager", "diff", "--", "man", "NAMESPACE"))
            stop("Rd files or NAMESPACE are out of date; run devtools::document() and commit:\n",
                 paste(stale, collapse = "\n"), call. = FALSE)
          }
        shell: Rscript {0}

      - name: Check
        env:
          NOT_CRAN: ""
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning")
        shell: Rscript {0}
