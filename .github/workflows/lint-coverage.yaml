name: lint-and-coverage

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - README.md
      - README.Rmd
      - README.html
      - _pkgdown.yml
      - NEWS.md
      - docs/**
      - pkgdown/**
      - man/**
      - inst/extdata/**
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - README.md
      - README.Rmd
      - README.html
      - _pkgdown.yml
      - NEWS.md
      - docs/**
      - pkgdown/**
      - man/**
      - inst/extdata/**
  workflow_dispatch:

jobs:
  lint-and-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::lintr,
            any::covr,
            any::testthat,
            local::.
          needs: check

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints)) stop(length(lints), " lint(s) found", call. = FALSE)
        shell: Rscript {0}

      - name: Test + Coverage
        run: |
          if (!requireNamespace('covr', quietly = TRUE)) install.packages('covr')
          cov <- covr::package_coverage()
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Total coverage: %.1f%%\n", pct))
          # Live-API tests skip here (NOT_CRAN is unset); the gate applies to
          # the offline and recorded-fixture tests alone.
          if (pct < 80) stop(sprintf("Coverage %.1f%% is below the 80%% minimum", pct), call. = FALSE)
        shell: Rscript {0}
