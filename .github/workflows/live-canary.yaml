name: NSO live service canary

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

permissions:
  contents: read

concurrency:
  group: nso-live-canary
  cancel-in-progress: false

jobs:
  public-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.
      - name: Check public response contracts
        run: Rscript tools/live-canary.R

  analytical-vignettes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::knitr, any::withr, local::.
          needs: website
      - name: Check live analytical examples
        run: Rscript tools/check_vignettes.R
      - name: Save analytical outputs and warning log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytical-vignette-checks
          path: check_vignettes
