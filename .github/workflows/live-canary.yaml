name: NSO live service canary

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 2'

permissions:
  contents: read

concurrency:
  group: nso-live-canary
  cancel-in-progress: false

jobs:
  public-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.
      - name: Check public response contracts
        run: Rscript tools/live-canary.R
