template:
  bootstrap: 5
  bslib:
    primary: "#0ea5e9"
    success: "#22c55e"
    warning: "#f59e0b"
    danger:  "#ef4444"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter Tight"}
    code_font: {google: "JetBrains Mono"}
    bootswatch: NULL
    bg: "#ffffff"
    fg: "#212529"
    enable-dark-mode: true
url: https://temuulene.github.io/mongolstats/
llm-docs: false
development:
  mode: auto
navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Getting Started
      href: articles/getting-started.html
    articles:
      text: Articles
      menu:
        - text: Discovering Public Health Data
          href: articles/discovery.html
        - text: Spatial Epidemiology with mongolstats
          href: articles/mapping.html
        - text: Mortality Seasonality Analysis
          href: articles/mortality-analysis.html
        - text: ----
        - text: Case Studies
        - text: Environmental Analysis
          href: articles/environmental-surveillance.html
        - text: UB District Analysis
          href: articles/ub-health-environment.html
    github:
      icon: fab fa-github
      aria-label: GitHub
      href: https://github.com/temuulene/mongolstats
home:
  title: mongolstats
  description: Tidy access to the statistics of the National Statistics Office of Mongolia through its PXWeb API.
  links:
    - text: NSO PXWeb
      href: https://data.1212.mn/pxweb/
  sidebar:
    structure: [links, license, community, citation, authors, dev]
opengraph:
  image:
    src: https://raw.githubusercontent.com/temuulene/mongolstats/main/man/figures/social.png
  twitter:
    creator: "@temuulen"
    card: summary_large_image
articles:
  - title: Guides
    contents:
      - getting-started
      - discovery
      - mapping
      - articles/mortality-analysis
  - title: Case Studies (Requires API)
    contents:
      - environmental-surveillance
      - ub-health-environment
reference:
  - title: Find Tables
    contents:
      - nso_search
      - nso_tables
      - nso_itms_by_sector
      - nso_sectors
      - nso_subsectors
  - title: Inspect Tables
    contents:
      - nso_dims
      - nso_dim_values
      - nso_variables
      - nso_table_meta
  - title: Periods
    contents:
      - nso_table_periods
      - nso_latest_periods
      - nso_period_seq
      - nso_period_date
  - title: Fetch Data
    contents:
      - nso_data
      - nso_package
      - nso_query
      - as_px_query
      - nso_fetch
  - title: Options, Caching and Offline Mode
    contents:
      - nso_options
      - nso_cache_enable
      - nso_cache_disable
      - nso_cache_clear
      - nso_cache_status
      - nso_offline_enable
      - nso_offline_disable
      - nso_rebuild_px_index
  - title: Superseded
    desc: Older names that keep working; new code should use the functions above.
    contents:
      - nso_itms
  - title: Deprecated
    desc: geoBoundaries helpers, replaced by the mongolmaps package.
    contents:
      - mn_boundaries
      - mn_boundary_keys
      - mn_boundaries_normalize
      - mn_join_by_name
      - mn_fuzzy_join_by_name
